name: Download SDK
description: Downloads and extracts SDK artifacts for a specific language

inputs:
  language:
    description: 'The SDK language to download (nodejs, python, dotnet, java)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download SDK
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.language }}-sdk.tar.gz
        path: ${{ github.workspace }}/sdk/

    - name: UnTar SDK folder
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: tar -zxf "$GITHUB_WORKSPACE/sdk/$LANGUAGE.tar.gz" -C "$GITHUB_WORKSPACE/sdk/$LANGUAGE"
