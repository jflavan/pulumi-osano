name: Setup Tools
description: Installs all tools (Go, Node, Python, .NET, Java, Pulumi, etc.) using mise

inputs:
  cache:
    description: Enable caching
    required: false
    default: "false"
  github_token:
    description: GitHub token
    required: true

runs:
  using: "composite"
  steps:
    # .config/mise.toml reads GO_VERSION_MISE and PULUMI_VERSION_MISE, falling back to "latest"
    # when they are unset. Its `_.source` of get-versions.sh does not reliably set them before
    # mise-action (v4) installs tools, which pulled in the latest Go and Pulumi. Export them first.
    - name: Resolve Go and Pulumi versions
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/get-versions.sh >> "$GITHUB_ENV"

    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
      with:
        version: 2025.11.6
        cache_save: ${{ inputs.cache }}
        github_token: ${{ inputs.github_token }}

    - name: Install mise tools
      shell: bash
      run: mise install

    - name: Setup Go Cache
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: ${{ inputs.cache }}
        cache-dependency-path: |
          provider/*.sum
          upstream/*.sum
          sdk/go/*.sum
          sdk/*.sum
          *.sum

    # Node comes from mise. npm auth is set up only by the release jobs that publish (release.yml):
    # setup-node v7 no longer exports a placeholder NODE_AUTH_TOKEN, and yarn fails on the unset
    # ${NODE_AUTH_TOKEN} in the .npmrc that registry-url writes.
