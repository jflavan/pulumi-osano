name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Build provider
        run: make provider

      - name: Run tests
        run: make test

      - name: Vet
        run: cd provider && go vet ./...

      - name: Upload provider binary
        uses: actions/upload-artifact@v4
        with:
          name: pulumi-resource-osano
          path: bin/pulumi-resource-osano
