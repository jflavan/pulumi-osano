[project]
  name = "pulumi_osano"
  description = "Unofficial Pulumi provider for managing Osano Cookie Consent and Unified Consent resources. Not affiliated with Pulumi Corporation or Osano, Inc."
  dependencies = ["packaging>=24.0", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "osano", "consent", "cookie-consent", "privacy", "cmp", "category/infrastructure", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.10"
  version = "0.1.0a0+dev"
  [project.license]
    text = "MIT"
  [project.urls]
    Homepage = "https://github.com/jflavan/pulumi-osano"
    Repository = "https://github.com/jflavan/pulumi-osano"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_osano = ["py.typed", "pulumi-plugin.json"]
