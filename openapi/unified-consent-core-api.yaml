openapi: 3.0.3
info:
  title: Unified Consent Core API
  description: >
    > **📍 Regional Distribution**  

    > The UC Core API is regionally distributed. Requests originating from the
    United States are processed in us-east-1, while requests from all other
    regions are processed in eu-central-1.


    # Introduction


    The Unified Consent Core API is a REST API to interact with the Osano
    Unified Consent platform. Before use, you must sign up at
    <https://osano.com>. You are bound by the Osano terms of service and limits
    placed by those terms. All interactions with the API require authentication
    using an Osano API key, or a Unified Consent API key in the
    `x-osano-api-key` and `x-uc-api-key` headers respectively. They are detailed
    in the "Authentication" section.


    ```sh

    curl --header 'x-uc-api-key: <API_KEY>'
    https://uc.api.osano.com/v2/consents/check/some-subject-id

    ```


    ## Versioning


    All resources are versioned according to semantic versioning with the major
    version being specified in the endpoints URI such as `v2`.


    All major versioning will maintain backwards compatibility in that major
    version. Resources may add new minor versions that are not specified in the
    URI. The minor versions will never break backward compatibility but may add
    new resources or enhancements. The enhancements may include new data in the
    schema. We will never remove data from a schema in the same major version.
    To prevent your scripts or applications from breaking due to newly added
    data, do not error on unexpected data.


    We will make a best effort to notify users when we release new major
    versions. We will deprecate the previous major version. Major versions may
    have breaking changes from previous versions such as schema changes or
    resource removal. All users should upgrade to the new major version in a
    timely manner.


    ## Authentication


    The Unified Consent Core API uses API keys to authenticate requests that are
    generated on a per-user basis. All calls require a valid, unexpired API key.
    There are two types of API keys that can be used with the Unified Consent
    Core API. They are the Osano API key and the Unified Consent API key. Routes
    that involve creating, updating, or merging subjects require the Osano API
    key. All other routes require the Unified Consent API key.


    ### Osano API key


    Osano API keys may be generated within the [Osano settings -> API
    Keys](https://my.osano.com/api-keys) page. You must be an admin or have the
    correct privileges to generate an API key.


    Once generated, the API key should be included in the `x-osano-api-key`
    header of all that involve creating, updating, or merging subjects. For
    example:


    ```sh

    curl --location 'https://uc.api.osano.com/v2/subject/merge' \

    --header 'x-osano-api-key: <API_KEY>' \

    --header 'Content-Type: application/json' \

    --data '{
        "sourceSubjectId": "some-source-subject-id",
        "targetSubjectId": "some-target-subject-id"
    }'

    ```


    ### Unified Consent API key


    Unified Consent API keys may be generated by using the `/v2/token/create`
    route. First gather the `configId` and the `customerId` from the
    Configuration details page. (Select the desired Configuration from the
    [Configurations list](https://my.osano.com/consent/panels) page) For
    example:


    ```sh

    curl --location 'https://uc.api.osano.com/v2/token/create' \

    --header 'Content-Type: application/json' \

    --data '{
        "customerId": "some-customer-id",
        "configId": "some-config-id"
    }'

    ```


    Note: Unified Consent API keys are scoped to a single Configuration, and
    will not work to submit consents for another Configuration


    ## Submitting a consent


    The following type describes the body of the request to create a consent. If
    submitting a GPC request, the actions array in the payload will be ignored
    and can be omitted. GPC actions are calculated internally based on the
    configured privacy protocols and the provided or detected geolocation:


    ```ts

    type CreateConsentRequest = {
      compliance?: {
        privacyPolicy?: {
          version?: string // The privacy policy version active at the time of submitting the consent
          url: string // The URL of the privacy policy
        }
        gpc?: number // 1 if GPC is enabled, 0 otherwise
      }
      subject: {
        verifiedId?: string // If the subject is verified, provide the subject's verified ID
        anonymousId?: string // If the subject is anonymous, provide the subject's anonymous ID
      }
      jurisdiction?: string | null // The applicable jurisdiction for the subject. Must be one of the configured jurisdictions, or null if none are applicable. Does not affect conflict resolution if omitted, but other features such as consent search may be affected.
      actions: [
        {
          target: string // The privacy protocol ID to submit consent for.
          vendor: string // The UC configuration ID to associate with the consent.
          action: string // The subject's consent choice for the privacy protocol. Possble values: 'ACCEPT' | 'REJECT' | 'UNSELECTED'
          jurisdiction?: string | null // The applicable jurisdiction for the subject. Must be one of the configured jurisdictions, or null if none are applicable. Does not affect conflict resolution if omitted, but other features such as consent search may be affected. Will override the top level jurisdiction if set.
        },
      ]
      tags: string[] // Tags associated with the consent. Can be any string. Ex: ['ccpa', 'tcpa']
      attributes: { [key: string]: any } // Attributes associated with the consent. `ipAddress` and `userAgent` are automatically populated, and values passed for those keys here will be overwritten.
      origin?: 'api' | 'gpc' // If submitting a GPC consent, use 'gpc', otherwise use 'api'
    }

    ```


    Applicable jurisdictions for a UC configuration can be determined by making
    a request to the `/v2/collections` endpoint.


    To populate the `target` and `vendor` values for a consent it is necessary
    to determine the privacy protocol ID and the UC configuration ID
    respectively.


    ### Finding the UC configuration ID


    To find the UC configuration ID, navigate to the [UC configurations
    page](https://my.osano.dev/unified-consent/configs). Click on the desired
    configuration to open the configuration details page. Click on the
    "Developers" tab, revealing the Config ID.


    ### Finding the privacy protocol ID


    To find the privacy protocol ID, follow the steps above to open the desired
    UC configuration's details page. Click on the "Privacy Protocols" tab. From
    the list of privacy protocols, pick the desired privacy protocol and click
    the pencil icon to open the "Edit Privacy Protocol" modal. There you will
    find the Target ID, which is the privacy protocol ID.
  version: 2.0.0
components:
  securitySchemes:
    ucApiKey:
      description: Unified Consent API key
      type: apiKey
      name: x-uc-api-key
      in: header
    osanoApiKey:
      description: Osano API key
      type: apiKey
      name: x-osano-api-key
      in: header
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
  schemas:
    def-0:
      type: object
      properties:
        privacyPolicy:
          type: object
          required:
            - url
          properties:
            version:
              type: string
            url:
              type: string
        gpc:
          type: integer
          minimum: 0
          maximum: 1
      title: compliance
    def-1:
      type: object
      required:
        - subject
        - actions
        - attributes
      properties:
        sessionToken:
          type: string
          description: Optional session token returned by the create profile endpoint.
        subject:
          type: object
          properties:
            verifiedId:
              type: string
              pattern: ^[^#% ]+$
            anonymousId:
              type: string
              pattern: ^[^#% ]+$
        compliance:
          $ref: '#/components/schemas/def-0'
        actions:
          type: array
          items:
            type: object
            required:
              - target
              - vendor
              - action
            properties:
              target:
                type: string
              vendor:
                type: string
              action:
                type: string
              jurisdiction:
                type: string
        attributes:
          type: object
        origin:
          type: string
        jurisdiction:
          type: string
      title: create-consent
    def-2:
      type: object
      required:
        - subject
        - actions
        - attributes
      properties:
        id:
          type: string
        subject:
          type: object
          properties:
            id:
              type: string
            verifiedId:
              type: string
            anonymousId:
              type: string
        actions:
          type: array
          items:
            type: object
            required:
              - target
              - vendor
              - action
            properties:
              target:
                type: string
              vendor:
                type: string
              action:
                type: string
        attributes:
          type: object
      title: consent
    def-3:
