paths:
  /v2/consents/unified/{subjectRef}:
    get:
      description: Retrieves the unified consent for a subject.
      parameters:
        - schema:
            type: string
            enum:
              - subject
              - session
          in: query
          name: ref
          required: false
          description: >-
            Indicates what type of reference is provided for the subject.
            Supports a subject id or a session id.
        - schema:
            type: string
          in: path
          name: subjectRef
          required: true
          description: Anonymous id, verified id, or a valid session id.
        - schema:
            type: string
          in: header
          name: x-country-code-override
          required: false
          description: >-
            Valid ISO 3166-1 country code to override the country resolution
            based on the IP address.
        - schema:
            type: string
          in: header
          name: x-region-code-override
          required: false
          description: >-
            Valid ISO 3166-2 region code to override the region resolution based
            on the IP address
      responses:
        '200':
          description: Valid unified consent.
          content:
            application/json:
              schema:
                type: object
                description: Valid unified consent.
                properties:
                  unifiedConsent:
                    $ref: '#/components/schemas/def-4'
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/def-3'
        '400':
          description: No consents found for the subject
  /v2/consents/check/{subjectId}:
    get:
      description: Checks whether a subject has given consent in a configuration.
      parameters:
        - schema:
            type: string
          in: path
          name: subjectId
          required: true
        - schema:
            type: string
          in: header
          name: x-country-code-override
          required: false
          description: >-
            Valid ISO 3166-1 country code to override the country resolution
            based on the IP address.
        - schema:
            type: string
          in: header
          name: x-region-code-override
          required: false
          description: >-
            Valid ISO 3166-2 region code to override the region resolution based
            on the IP address
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
  /v2/consent-profiles/{hashedSubjectId}:
    get:
      description: Retrieves the unified consent for a subject.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          name: configId
          required: true
        - schema:
            type: string
          in: path
          name: hashedSubjectId
          required: true
        - schema:
            type: string
          in: header
          name: x-country-code-override
          required: false
          description: >-
            Valid ISO 3166-1 country code to override the country resolution
            based on the IP address.
        - schema:
            type: string
          in: header
          name: x-region-code-override
          required: false
          description: >-
            Valid ISO 3166-2 region code to override the region resolution based
            on the IP address
      responses:
        '200':
          description: Valid unified consent.
          content:
            application/json:
              schema:
                type: object
                description: Valid unified consent.
                properties:
                  unifiedConsent:
                    $ref: '#/components/schemas/def-4'
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/def-3'
        '400':
          description: No consents found for the subject
  /v2/collections:
    get:
      summary: Retrieves all collections for a given configId based on jurisdiction
      description: >-
        Uses the configId embedded in the Unified Consent API key to retrieve an
        aggregrate of all 

        applicable collections of privacy protocols for a given jurisdiction.
        The type can either be 'draft' or 'published'. 

        If the type is not provided, the default is 'published'. If the
        jurisdiction is not provided, IP geolocation is used 

        to determine the jurisdiction.
      parameters:
        - schema:
            type: string
          in: query
          name: jurisdiction
          required: false
        - schema:
            type: string
            enum:
              - published
              - draft
            default: published
          in: query
          name: type
          required: false
      responses:
        '200':
          description: >-
            The collections matching the query and all available and available
            jurisdictions
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/def-6'
                description: >-
                  The collections matching the query and all available and
                  available jurisdictions
  /v2/collections/{collectionId}:
    get:
      summary: Retrieves a collection of privacy protocols
      description: Retrieves a collection of privacy protocols by id
      parameters:
        - schema:
            type: string
          in: path
          name: collectionId
          required: true
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/def-5'
                description: The collection
  /v2/subjects/{subjectRef}:
    get:
      description: Retrieves subject by id or from a valid session
      parameters:
        - schema:
            type: string
            enum:
              - subject
              - session
          in: query
          name: ref
          required: false
          description: >-
            Indicates what type of reference is provided for the subject.
            Supports a subject id or a session id.
        - schema:
            type: string
          in: path
          name: subjectRef
          required: true
          description: Anonymous id, verified id, or a valid session id.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  verifiedId:
                    type: string
                  anonymousId:
                    type: string
  /v2/config:
    get:
      description: Retrieves a UC config
      responses:
        '200':
          description: The UC config
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/def-20'
                description: The UC config
  /v2/consents:
    post:
      description: Create and insert a consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/def-1'
      parameters:
        - schema:
            type: string
          in: header
          name: x-country-code-override
          required: false
          description: >-
            Valid ISO 3166-1 country code to override the country resolution
            based on the IP address.
        - schema:
            type: string
          in: header
          name: x-region-code-override
          required: false
          description: >-
            Valid ISO 3166-2 region code to override the region resolution based
            on the IP address
      responses:
        '201':
          description: Consent inserted
  /v2/consents/gpc:
    post:
      description: Create and insert a gpc consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/def-22'
      parameters:
        - schema:
            type: string
          in: header
          name: x-country-code-override
          required: false
