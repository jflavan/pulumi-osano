      properties:
        type:
          type: string
        resolution:
          type: string
        actionsInConflict:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
              vendor:
                type: string
              action:
                type: string
              consentId:
                type: string
                nullable: true
              channelId:
                type: string
                nullable: true
              createdAt:
                type: string
                nullable: true
      title: conflict
    def-4:
      type: object
      required:
        - subjectId
        - brandId
        - actions
        - attributes
      properties:
        subjectId:
          type: string
        brandId:
          type: string
        channelIds:
          type: array
          items:
            type: string
        compliance:
          $ref: '#/components/schemas/def-0'
        actions:
          type: array
          items:
            type: object
            required:
