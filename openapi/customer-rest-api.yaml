      in: query
      description: >-
        Request type filter for the request. Must be one of DELETE, CORRECT,
        SUMMARIZE, DO_NOT_SELL, OPT_OUT, LIMIT_USE, OTHER, PORTABILITY, or
        CUSTOM_[1-5]
      schema:
        type: string
        enum:
          - DELETE
          - CORRECT
          - SUMMARIZE
          - DO_NOT_SELL
          - OPT_OUT
          - LIMIT_USE
          - OTHER
          - PORTABILITY
          - CUSTOM_1
          - CUSTOM_2
          - CUSTOM_3
          - CUSTOM_4
          - CUSTOM_5
    formIdParam:
      name: formId
      required: false
      in: query
      description: Form identifier through which the Subject Rights Request was made.
      schema:
        type: integer
        format: int32
    connectorIdParam:
      name: connectorId
      required: false
      in: query
      description: >-
        Optional connector identifier to filter data stores by.  This value is
        ignored when the Data Store type is 'internal'.
      schema:
        type: integer
        format: int32
    dataStoresActiveParam:
      name: active
      required: false
      in: query
      description: >-
        The active status of the Data Stores to be returned.  If omitted, only
        active Data Stores are returned.
      schema:
        type: boolean
    dataStoresNameParam:
      name: name
      required: false
      in: query
      description: >-
        The name of the Data Stores to be returned.  Partial matches will also
        be returned.
      schema:
        type: string
        maxLength: 64
    dataStoresTypeParam:
      name: type
      required: false
      in: query
      description: >-
        The type of the Data Stores to be returned.  If omitted, all Data Stores
        are returned.
      schema:
        type: string
        enum:
          - internal
          - saas
          - onprem
    productNameParam:
      name: name
      required: false
      in: query
      description: Product name to filter by.  This may return partial matches.
      schema:
        type: string
        maxLength: 64
    dsarIdParam:
      name: dsarId
      required: false
      in: query
      description: The id of the Subject Rights request to filter by
      schema:
        type: string
    messageIdParam:
      name: messageId
      required: true
      in: path
      description: The id of the message to update
      schema:
        type: string
    actionItemStatusParam:
      name: status
      required: false
      in: query
      description: >-
        Status filter for the request. Must be one of CLAIMED, IN_PROGRESS,
        COMPLETED, or REJECTED.
      schema:
        type: string
        enum:
          - CLAIMED
          - IN_PROGRESS
          - COMPLETED
          - REJECTED
    connectorTypeParam:
      name: type
      required: false
      in: query
      description: >-
        The type of Connectors to be returned.  By default, all Connectors are
        returned.
      schema:
        type: string
        enum:
          - saas
          - onprem
  schemas:
    CustomerInsights:
      type: object
      minProperties: 2
      properties:
        entitlements:
          type: object
          description: Products enabled for the customer.
        products:
          type: object
          description: Spotlight product-related metrics for the customer.
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    CmpConfig:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the configuration.
        domains:
          type: array
          minItems: 1
          description: >-
            A list of domains (cannot be null or empty) that are permitted to
            host the configuration.
          items:
            type: string
        orgIds:
          type: array
          uniqueItems: true
          description: >-
            A list of organization IDs that the configuration is associated
            with. If omitted or empty, the configuration is associated with the
            root organization of the customerId that created the API key used to
            make the request.
          items:
            type: string
            format: uuid
        mode:
          type: string
          description: >
            The compliance mode for the configuration.


            - `debug`: Discovery/Listener Mode - Script and cookie information
            will be gathered for categorization, but blocking will not occur and
            the consent dialog will not be displayed.

            - `permissive`: Permissive Mode - The consent dialog will be
            displayed. All <i>uncategorized</i> scripts will be reported as
            discoveries and allowed regardless of consent given. All
            <i>categorized</i> scripts will be allowed or blocked based on the
            user selection.

            - `production`: Strict Mode <b>(recommended)</b> - The consent
            dialog will be displayed, and all uncategorized scripts will be
            blocked until they have been classified.


            Note: It is recommended that all discovered scripts & cookies are
            classified before changing the mode to `production` as all
            unclassified entities will be blocked. For more information, see
            Compliance Mode Definitions in the [Cmp Setup
            Guide](https://docs.osano.com/hc/en-us/articles/22472106973332-Cmp-Setup-Guide#Step1)
          enum:
            - debug
            - permissive
            - production
        configuration:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            additionalLinks:
              type: array
              minItems: 1
              maxItems: 1
              description: >
                A nested array where the inner array contains two strings that
                represent the text and URL for an additional link that can be
                added to the consent banner.

                - The first string determines the text that will be displayed on
                the link and must be one of `subjectRightsRequest`,
                `doNotSellOrShare`, `imprint`, `cookiePolicy`, `privacyPolicy`,
                `securityPolicy`, `storagePolicy`, or `googlePrivacyPolicy`.
                <b>Note:</b> this string value cannot be the same as the
                `policyLinkText` value.

                - The second string is the relative or absolute URL that the
                link will navigate to when clicked.


                Example: `[['subjectRightsRequest',
                'https://example.com/subject-rights-request']]`
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: string
            allowTimeout:
              type: boolean
              description: >-
                Enables or disables the automatic timeout of banners and dialogs
                that are on a timer. If disabled, the site visitor will need to
                interact with the banner or dialog to make it disappear.
            amazonConsent:
              type: boolean
              description: >-
                When set to `true`, Amazon Consent Signal will be shared with
                Amazon Ads scripts on your site. If you’re not using Amazon Ads
                scripts, we recommend setting this to `false` or omitting this
                property.
            ccpaRelaxed:
              type: boolean
              description: >-
                When enabled, visitors in California, Colorado, Connecticut,
                Utah, and Virginia will be shown consent banner format 1 and
                consent will be implied. When disabled, visitors in California,
                Colorado, Connecticut, Utah, and Virginia will be shown consent
                banner format 3 and explicit consent is required. For more
                information, see [US State Level Legislation Opt-Out Banner
                Format
                Setting](https://docs.osano.com/hc/en-us/articles/22469433588756-US-State-Level-Legislation-Opt-Out-Banner-Format-Setting)
            codeSplitting:
              type: boolean
              description: >-
                When enabled, the `osano.js` script is segemented into a reduced
                initial payload with additional requests made as needed. This
                may help improve site rendering.
            crossDomain:
              type: boolean
              description: >-
                When enabled, it allows multiple domains to be added to the
                configuration settings and allows initial consent to be shared
                across unrelated domains owned by the same entity. For more
                information, see [Cross Domain
                Support](https://docs.osano.com/cross-domain-support).
            dntSupport:
              type: boolean
              description: >-
                Enables or disables honoring Do Not Track (DNT) signals from the
                site visitor's browser.
            forcedClassifyEnabled:
              type: boolean
              description: >-
                When set to `true`, Osano will automatically block a list of
                curated scripts and cookies (in addition to (and superseding)
                your existing rules) in regions where their specific usage has
                been declared illegal by regulatory bodies. When false, Osano
                will respect existing classification settings. See [Block
                List](https://docs.osano.com/hc/en-us/articles/22469397117716-Block-list)
                for a list of blocked cookies.
            forceManagePreferences:
              type: boolean
              description: >-
                When set to `true`, a "Manage Preferences" button will be
                present on banner templates 1 and 3. When set to `false`, banner
                templates 1 and 3 will not have a "Manage Preferences" button.
                For more information on banner templates, see [Consent Banner
                Gallery](https://docs.osano.com/hc/en-us/articles/21084783710996-Consent-Banner-Gallery).
            googleConsent:
              type: boolean
              description: >-
                When enabled, Google Consent Mode for Google Analytics is
                supported. GCM must be implemented via Google configuration for
                this option to function. If you're unsure whether you're using
                GCM, it is recommended to set this to `false`. For more
                information, see [Google Consent
                Mode](https://docs.osano.com/google-consent).
            gpcSupport:
              type: boolean
              description: >-
                When set to `true`, the Global Privacy Control (GPC) signal is
                honored. For more information, see [Global Privacy
                Control](https://docs.osano.com/global-privacy-controls-gpc)
            iframeBlocking:
              type: string
              enum:
                - ''
                - debug
                - permissive
                - production
              description: >
                The mode for allowing or blocking iframes. Note: If `""` is
                selected, then iframes will not be blocked or discovered. If the
                top level mode is set to a lower level than the iframe mode,
                then the iframe mode will be ignored.
            localStorageBlocking:
              type: string
              enum:
                - ''
                - debug
                - permissive
                - production
              description: >
                The mode for allowing or blocking local storage. Note: If `""`
                is selected, then local storage will not be blocked or
                discovered. If the top level mode is set to a lower level than
                the local storage mode, then the local storage mode will be
                ignored.
            managePreferencesEnabled:
              type: boolean
              description: >-
                When set to `true`, First Layer Categories are disabled and
                users in EEA member countries and the UK won't see category
                toggles in the banner. When set to `false`, First Layer
                Categories are enabled and users in EEA member countries and the
                UK are shown cookie category toggles in the banner. For more
                information, see [First Layer
                Categories](https://docs.osano.com/first-layer-categories).
            microsoftConsent:
              type: boolean
              description: >-
                When set to `true`, Osano will share user consent choices with
                Microsoft UET. Microsoft UET must be implemented on your website
                for this option to function. Please note that this signal is
                incompatible with the use of IAB TCF 2.x consent signals.
            palette:
              type: object
              additionalProperties: false
              description: >-
                The styling and color palette for the banner, drawer, and DNS
                (Do Not Sell) dialogs. Colors must be given in [CSS numerical
                format](https://www.w3.org/TR/css-color-3/#numerical)
                (hexadecimal, RGBa or HSLa). Color keywords are not supported.
                To remove a color, set the value to `null`.
              properties:
                buttonAcceptBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Accept button in the banner. If
                    this is not set, it will fallback to the value set for
                    `buttonBackgroundColor`.
                buttonAcceptBackgroundColorHover:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Accept button in the banner when
                    hovered. If this is not set, it will fallback to the value
                    set for `buttonBackgroundColorHover`.
                buttonAcceptBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the Accept button in the banner. If this
                    is not set, it will fallback to the value set for
                    `buttonBorderColor`.
                buttonAcceptForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the Accept button in the banner. If this
                    is not set, it will fallback to the value set for
                    `buttonForegroundColor`.
                buttonBackgroundColor:
                  type: string
                  nullable: true
                  description: The background color of the buttons.
                buttonBackgroundColorHover:
                  type: string
                  nullable: true
                  description: The background color of the buttons when hovered.
                buttonBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the buttons. If this is not set, it will
                    default to the value set for `buttonForegroundColor`.
                buttonCloseColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the close button in the banner. If this is
                    not set, it will fallback to the value set for
                    `dialogForegroundColor`.
                buttonDenyBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Deny button in the banner. If
                    this is not set, it will fallback to the value set for
                    `buttonBackgroundColor`.
                buttonDenyBackgroundColorHover:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Deny button in the banner when
                    hovered. If this is not set, it will fallback to the value
                    set for `buttonBackgroundColorHover`.
                buttonDenyBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the Deny button in the banner. If this
                    is not set, it will fallback to the value set for
                    `buttonBorderColor`.
                buttonDenyForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the Deny button in the banner. If this is
                    not set, it will fallback to the value set for
                    `buttonForegroundColor`.
                buttonRejectAllBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Reject All button in the banner.
                    If this is not set, it will fallback to the value set for
                    `buttonBackgroundColor`.
                buttonRejectAllBackgroundColorHover:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Reject All button in the banner
                    when hovered. If this is not set, it will fallback to the
                    value set for `buttonBackgroundColorHover`.
                buttonRejectAllBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the Reject All button in the banner. If
                    this is not set, it will fallback to the value set for
                    `buttonBorderColor`.
                buttonRejectAllForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the Reject All button in the banner. If
                    this is not set, it will fallback to the value set for
                    `buttonForegroundColor`.
                buttonForegroundColor:
                  type: string
                  nullable: true
                  description: The text color of the buttons.
                buttonManageBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Manage Preferences button in the
                    banner. If this is not set, it will fallback to the value
                    set for `buttonBackgroundColor`.
                buttonManageBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the Manage Preferences button in the
                    banner. If this is not set, it will fallback to the value
                    set for `buttonBorderColor`.
                buttonManageForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the Manage Preferences button in the
                    banner. If this is not set, it will fallback to the value
                    set for `buttonForegroundColor`.
                buttonManageBackgroundColorHover:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the Manage Preferences button in the
                    banner when hovered. If this is not set, it will fallback to
                    the value set for `buttonBackgroundColorHover`.
                dialogBackgroundColor:
                  type: string
                  nullable: true
                  description: The background color of the dialogs.
                dialogForegroundColor:
                  type: string
                  nullable: true
                  description: The text color of the dialogs.
                dialogGpcBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the GPC opt-out indicator in the
                    banner.
                dialogGpcBorderColor:
                  type: string
                  nullable: true
                  description: The border color of the GPC opt-out indicator in the banner.
                dialogGpcForegroundColor:
                  type: string
                  nullable: true
                  description: The text color of the GPC opt-out indicator in the banner.
                dialogGpcColor:
                  type: string
                  nullable: true
                  description: >-
                    The status dot color of the GPC opt-out indicator in the
                    banner.
                dialogType:
                  type: string
                  nullable: true
                  enum:
                    - bar
                    - box
                  description: >
                    The type of banner to display. 

                    - `bar`: A banner that appears at the top or bottom of the
                    page.

                    - `box`: A dialog that appears in the center of the page.
                displayPosition:
                  type: string
                  nullable: true
                  description: >
                    If the `dialogType` is `bar`, valid options are `top` and
                    `bottom` and defaults to `top` if `displayPosition` is
                    `null`.

                    If the `dialogType` is `box`, then valid options are
                    `top-left`, `top-right`, `bottom-left`, `bottom-right`, and
                    `center` and defaults to `center` if `displayPosition` is
                    `null`.
                gpcBackgroundColor:
                  type: string
                  nullable: true
                  description: The background color of the GPC opt-out widget.
                gpcBorderColor:
                  type: string
                  nullable: true
                  description: The border color of the GPC opt-out widget.
                gpcForegroundColor:
                  type: string
                  nullable: true
                  description: The text color of the GPC opt-out widget.
                gpcColor:
                  type: string
                  nullable: true
                  description: The status dot color of the GPC opt-out widget.
                gpcBackgroundColorHover:
                  type: string
                  nullable: true
                  description: The background color of the GPC opt-out widget when hovered.
                infoDialogBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the drawer and DNS dialogs. If this
                    is not set, it will fallback to the value set for
                    `dialogBackgroundColor`.
                infoDialogForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the drawer and DNS dialogs. If this is not
                    set, it will fallback to the value set for
                    `dialogForegroundColor`.
                infoDialogOverlayColor:
                  type: string
                  nullable: true
                  description: The overlay color of the drawer and DNS dialogs.
                infoDialogButtonBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the drawer and DNS dialogs buttons.
                    If this is not set, it will fallback to the value set for
                    `buttonBackgroundColor`.
                infoDialogButtonBackgroundColorHover:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the drawer and DNS dialogs buttons
                    when hovered. If this is not set, it will fallback to the
                    value set for `buttonBackgroundColorHover`.
                infoDialogButtonBorderColor:
                  type: string
                  nullable: true
                  description: >-
                    The border color of the drawer and DNS dialogs buttons. If
                    this is not set, it will fallback to the value set for
                    `buttonBorderColor`.
                infoDialogButtonCloseColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the close button in the drawer and DNS
                    dialogs. If this is not set, it will fallback to the value
                    set for `infoDialogForegroundColor`.
                infoDialogButtonForegroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The text color of the drawer and DNS dialogs buttons. If
                    this is not set, it will fallback to the value set for
                    `buttonForegroundColor`.
                infoDialogGpcBackgroundColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the GPC opt-out indicator in the
                    drawer.
                infoDialogGpcBorderColor:
                  type: string
                  nullable: true
                  description: The border color of the GPC opt-out indicator in the drawer.
                infoDialogGpcForegroundColor:
                  type: string
                  nullable: true
                  description: The text color of the GPC opt-out indicator in the drawer.
                infoDialogGpcColor:
                  type: string
                  nullable: true
                  description: >-
                    The status dot color of the GPC opt-out indicator in the
                    drawer.
                infoDialogLinkColor:
                  type: string
                  nullable: true
                  description: >-
                    The color of links in the drawer and DNS dialogs. If this is
                    not set, it will fallback to the value set for `linkColor`.
                infoDialogPosition:
                  type: string
                  nullable: true
                  description: The position of the drawer.
                  enum:
                    - right
                    - left
                infoDialogToggleOffTrackColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the toggle button in the drawer and
                    DNS dialogs when it is in the disabled position. If this is
                    not set, it will fallback to the value set for
                    `toggleOffTrackColor`.
                infoDialogToggleOffThumbColor:
                  type: string
                  nullable: true
                  description: >-
                    The color of the toggle button indicator in the drawer and
                    DNS dialogs when it is in the disabled position. If this is
                    not set, it will fallback to the value set for
                    `toggleOffThumbColor`.
                infoDialogToggleOnTrackColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the toggle button in the drawer and
                    DNS dialogs when it is in the enabled position. If this is
                    not set, it will fallback to the value set for
                    `toggleOnTrackColor`.
                infoDialogToggleOnThumbColor:
                  type: string
                  nullable: true
                  description: >-
                    The color of the toggle button indicator in the drawer and
                    DNS dialogs when it is in the enabled position. If this is
                    not set, it will fallback to the value set for
                    `toggleOnThumbColor`.
                linkColor:
                  type: string
                  nullable: true
                  description: The color of the links.
                optOutWidgetPosition:
                  type: string
                  nullable: true
                  description: The position of the opt-out widget.
                  enum:
                    - right
                    - left
                toggleOffThumbColor:
                  type: string
                  nullable: true
                  description: >-
                    The color of the toggle button indicators when they are in
                    the disabled position.
                toggleOffTrackColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the toggle buttons when they are in
                    the disabled position.
                toggleOnTrackColor:
                  type: string
                  nullable: true
                  description: >-
                    The background color of the toggle buttons when they are in
                    the enabled position.
                toggleOnThumbColor:
                  type: string
                  nullable: true
                  description: >-
                    The color of the toggle button indicators when they are in
                    the enabled position.
                toggleButtonOffColor:
                  type: string
                  nullable: true
                  deprecated: true
                  description: >-
                    The color of the toggle button indicators when they are in
                    the disabled position. This property is deprecated. Please
                    use `toggleOffThumbColor` instead.
                toggleButtonOnColor:
                  type: string
                  nullable: true
                  deprecated: true
                  description: >-
                    The color of the toggle button indicators when they are in
                    the enabled position. This property is deprecated. Please
                    use `toggleOnThumbColor` instead.
                toggleOffBackgroundColor:
                  type: string
                  nullable: true
                  deprecated: true
                  description: >-
                    The background color of the toggle buttons when they are in
                    the disabled position. This property is deprecated. Please
                    use `toggleOffTrackColor` instead.
                toggleOnBackgroundColor:
                  type: string
                  nullable: true
                  deprecated: true
                  description: >-
                    The background color of the toggle buttons when they are in
                    the enabled position. This property is deprecated. Please
                    use `toggleOnTrackColor` instead.
                widgetPosition:
                  type: string
                  nullable: true
                  description: The position of the widget.
                  enum:
                    - right
                    - left
            policyLinkInDrawer:
              type: boolean
              description: >-
                Enables or disables the presentation of the policy link in the
                preferences drawer.
            policyLinkText:
              type: string
              enum:
                - cookieNotice
                - cookiePolicy
                - storagePoloicy
                - privacyNotice
                - privacyPolicy
              description: >-
                The text of the link displayed in the dialog (and optionally, in
                the drawer - see `policyLinkInDrawer` property) that links the
                site visitor to the url specified  in the `storagePolicyHref`
                property.
            showConsentUuid:
              type: boolean
              description: >-
                When set to `true`, the end user’s consent UUID will be present
                in the Preference Drawer with a copy button. When disabled, an
                end user will need to access their Osano cookie in their browser
                to locate the consent UUID.
            showOptOutWidget:
              type: boolean
              description: >-
                When set to `true`, the opt-out widget will be displayed on the
                site. When set to `false`, the opt-out widget will be hidden.
            showWidget:
              type: boolean
              description: >-
                When set to `true`, the consent widget will be displayed on the
                site. When set to `false`, the widget will be hidden.
            storagePolicyHref:
              type: string
              description: >-
                The URL for your site's privacy policy. Can be relative or
                absolute.
            tattleSampling:
              type: number
              format: float
              maximum: 1
              minimum: 0
              description: >-
                The percentage of visitors (0-1) for whom discoveries will be
                recorded. A value of 0 disables discovery recording, while a
                value of 1 records discoveries for all visitors.
            timeoutSeconds:
              type: integer
              description: >-
                The number of seconds to wait before hiding the banner and
                saving default consent settings.
            translations:
              type: object
              additionalProperties: false
              description: Translation overrides for the configuration text strings.
              properties:
                messaging:
                  type: object
                  additionalProperties: false
                  properties:
                    categories:
                      type: object
                      additionalProperties: true
                    closeButton:
                      type: object
                      additionalProperties: true
                    default:
                      type: object
                      additionalProperties: true
                    timer:
                      type: object
                      additionalProperties: true
                    usageHow:
                      type: object
                      additionalProperties: true
                    usageList:
                      type: object
                      additionalProperties: true
                    usageWhat:
                      type: object
                      additionalProperties: true
                    viewCookies:
                      type: object
                      additionalProperties: true
                    viewDisclosures:
                      type: object
                      additionalProperties: true
                drawer:
                  type: object
                  additionalProperties: false
                  properties:
                    description:
                      type: object
                      additionalProperties: true
                    header:
                      type: object
                      additionalProperties: true
                doNotSell:
                  type: object
                  additionalProperties: false
                  properties:
                    description:
                      type: object
                      additionalProperties: true
                    header:
