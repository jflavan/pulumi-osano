components:
  requestBodies:
    CmpRulesPost:
      description: >-
        The Cookie Consent Rule(s) to be created and the ID(s) of the config(s)
        to create them for.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - configIds
            properties:
              configIds:
                type: array
                minItems: 1
                maxItems: 25
                items:
                  type: string
                  format: uuid
              cookies:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/CmpCookieRuleRequiredProps'
              iframes:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/CmpRuleRequiredProps'
              scripts:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/CmpRuleRequiredProps'
              localStorage:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/CmpRuleRequiredProps'
    CmpRulePatch:
      description: The Cookie Consent Rule property(ies) to be updated.
      required: true
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/CmpRule'
              - $ref: '#/components/schemas/CmpCookieRule'
  responses:
    CustomerInsightsResponseList:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                $ref: '#/components/schemas/CustomerInsights'
    CmpRulesList:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  oneOf:
                    - type: object
                      allOf:
                        - $ref: '#/components/schemas/CmpRule'
                        - $ref: '#/components/schemas/CmpRuleResponseProperties'
                    - type: object
                      allOf:
                        - $ref: '#/components/schemas/CmpCookieRule'
                        - $ref: '#/components/schemas/CmpRuleResponseProperties'
    CmpRulePatch:
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                allOf:
                  - $ref: '#/components/schemas/CmpRule'
                  - $ref: '#/components/schemas/CmpRuleResponseProperties'
              - type: object
                allOf:
                  - $ref: '#/components/schemas/CmpCookieRule'
                  - $ref: '#/components/schemas/CmpRuleResponseProperties'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-osano-api-key
  parameters:
    limitParam:
      name: limit
      required: false
      in: query
      description: The number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    CmpConfigLimitParam:
      name: limit
      required: false
      in: query
      description: The number of items to return.
      schema:
        type: integer
        format: int32
        maximum: 1000
        default: 100
    nextTokenParam:
      name: next
      required: false
      in: query
      description: The pagination token from the previous request.
      schema:
        type: string
    afterParam:
      name: after
      required: false
      in: query
      description: >-
        Specify UTC date and time in ISO-8601 format (e.g. 2021-01-01T00:00:00Z)
        to filter items created after this date.
      schema:
        type: string
    sortByParam:
      name: sortBy
      required: false
      in: query
      description: Specify a field to sort by. If omitted, the default sort order is used.
      schema:
        type: string
        default: created
        enum:
          - name
          - created
          - updated
          - lastPublished
    sortOrderParam:
      name: sortOrder
      required: false
      in: query
      description: >-
        Specify the order in which results are returned.  If omitted, the
        default sort order is used.
      schema:
        type: string
        default: desc
        enum:
          - asc
          - desc
    domainParam:
      name: domain
      required: false
      in: query
      description: >-
        A domain to filter results by. If your domain has non-standard
        characters, please use Punycode encoding.
      schema:
        type: string
        pattern: >-
          ^((?:(?:(?!-))(?:xn--|_)?[A-Za-z0-9-]{0,61}[A-Za-z0-9]{1,1}\.){1,}[A-Za-z]{2,6})$
      examples:
        example:
          value: example.com
          summary: >-
            This example filters results to only include those associated with
            the specified domain.
        punycodeExample:
          value: xn--mnchen-3ya.com
          summary: >-
            This example filters results to only include those associated with
            domain "münchen.com", which is represented in Punycode as
            "xn--mnchen-3ya.com".
    domainsParam:
      name: domains
      required: false
      in: query
      description: >-
        A comma-separated list of domains to filter results by. If your domain
        has non-standard characters, please use Punycode encoding. The optional
        prefix can be used to specify how the filter is applied: any (default) -
        return results that match any of the specified domains; not - return
        results that do not match any of the specified domains; all - return
        results that match all of the specified domains. Example:
        "any:example.com,another-example.org" or
        "not:example.com,another-example.org" or
        "all:example.com,another-example.org"
      schema:
        type: string
        pattern: >-
          ^(?:(any|all|not):)?((?:(?!-)(?:xn--|_)?[A-Za-z\d-]{0,61}[A-Za-z\d]\.)+[A-Za-z]{2,6})(?:,((?:(?!-)(?:xn--|_)?[A-Za-z\d-]{0,61}[A-Za-z\d]\.)+[A-Za-z]{2,6}))*$
      examples:
        singleDomain:
          value: example.com
          summary: >-
            This example filters results to only include those associated with
            the specified domain.
        multipleDomains:
          value: example.com, another-example.org, sub.domain.co.uk
          summary: >-
            This example filters results to include those associated with any of
            the specified domains.
    orgIdsParam:
      name: orgIds
      required: false
      in: query
      description: >-
        A comma-separated list of organization UUIDs to filter results by. The
        optional prefix can be used to specify how the filter is applied: any
        (default) - return results that match any of the specified org IDs; na -
        return results that do not match any of the specified org IDs; all -
        return results that match all of the specified org IDs. Example:
        "any:uuid1,uuid2" or "not:uuid1,uuid2" or "all:uuid1,uuid2"
      schema:
        type: string
        pattern: >-
          ^(?:(any|all|not):)?((?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:,[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})*)$
      examples:
        noPrefix:
          value: >-
            123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: >-
            This example omits the prefix, which defaults to "any", to return
            results that match any of the specified org IDs.
        any:
          value: >-
            any:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: >-
            This example uses the "any" prefix to return results that match any
            of the specified org IDs.
        all:
          value: >-
            all:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: >-
            This example uses the "all" prefix to return results that match all
            of the specified org IDs.
        not:
          value: >-
            not:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: >-
            This example uses the "not" prefix to return results that do not
            match any of the specified org IDs.
