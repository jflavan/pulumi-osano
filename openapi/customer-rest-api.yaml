paths:
  /v1/customer-insights:
    get:
      summary: Compliance API
      description: >-
        Insights returning entitlements and spotlight metrics for a given
        customer
      tags:
        - customerInsights
      operationId: getCustomerInsights
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/responses/CustomerInsightsResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/configs:
    get:
      summary: List Cookie Consent Configurations
      description: >-
        Returns a list of Cookie Consent Configurations. Results are sorted in
        descending order by creation time by default. The sort by field can be
        overridden by specifying a `sortBy` param. The number of results
        returned may be controlled via the limit param, but may not exceed
        1000.  The "next" object in the response may be used to retrieve
        subsequent pages of the same resource.
      tags:
        - cmp
      operationId: getConfigs
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: >-
            The name of the configuration to filter results by (case
            insensitive, partial matches allowed).
        - $ref: '#/components/parameters/domainsParam'
        - $ref: '#/components/parameters/CmpConfigLimitParam'
        - $ref: '#/components/parameters/nextTokenParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/orgIdsParam'
        - $ref: '#/components/parameters/cmpConfigModeParam'
        - $ref: '#/components/parameters/cmpConfigPublishStatusParam'
        - $ref: '#/components/parameters/cmpConfigTattleRecordStoppedParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmpConfigResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create New Cookie Consent Configuration
      description: Create a new Cookie Consent Configuration.
      tags:
        - cmp
      operationId: createConfig
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmpConfigWithDefaults'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmpConfigResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/configs/{configId}:
    get:
      summary: Return Detailed Cookie Consent Configuration
      description: Get a detailed Cookie Consent Configuration by ID.
      tags:
        - cmp
      operationId: getConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmpConfigResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update Cookie Consent Configuration
      description: Update an existing Cookie Consent Configuration.
      tags:
        - cmp
      operationId: updateConfig
      parameters:
        - name: configId
          required: true
          in: path
          description: The identifier of the Cookie Consent Configuration to be updated.
          schema:
            type: string
      requestBody:
        description: >-
          The properties to be updated on the Cookie Consent Configuration. 
          Note: this allows for a partial update, so all fields are optional.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmpConfig'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmpConfigResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/configs/{configId}/publish:
    post:
      summary: Publish Cookie Consent Configuration
      description: >
        Publish an existing Cookie Consent Configuration.


        Guidelines for publishing a configuration:

        - A configuration cannot be queued again for publishing until the
        publish operation is complete. It's recommended that all configuration
        changes are made prior to sending a publish request for that
        configuration.

        - A maximum of 300 configs per customer account can be queued for
        publishing at a time.

        - It's recommended to send a batch of publish requests (up to 250
        requests) every 30 minutes. Note: this is not the equivalent to sending
        X number of publish requests per minute over a 30 minute period."
      tags:
        - cmp
      operationId: publishConfig
      parameters:
        - name: configId
          required: true
          in: path
          description: The identifier of the Cookie Consent Configuration to be published.
          schema:
            type: string
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keepUnclassifiedTattles:
                  type: boolean
                  description: >-
                    When `true`, unclassified cookie/script/iframe discoveries
                    will not be deleted. When `false`, all unclassified
                    cookie/script/iframe discoveries will be deleted.
                description:
                  type: string
                  description: >-
                    When included in the request, allows for text comments
                    provided about the publish to be retained with the version
                    number for reference in the Osano Admin UI.
                webhookUrl:
                  type: string
                  description: The URL to be called when the publish operation is complete.
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/configs/{configId}/discoveries:
    get:
      summary: List Configuration Discoveries
      description: >-
        Retrieve a list of Discoveries for a Cookie Consent Configuration by
        configuration ID.
      tags:
        - cmp
      operationId: getTattles
      parameters:
        - name: configId
          required: true
          in: path
          description: The identifier of the Cookie Consent Configuration to be queried.
          schema:
            type: string
        - $ref: '#/components/parameters/cmpDiscoveriesStoreTypeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmpDiscoveriesResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/configs/{configId}/rules:
    get:
      summary: List Configuration Rules
      description: >-
        Retrieve a list of Rules for a Cookie Consent Configuration by
        configuration ID.
      tags:
        - cmp
      operationId: getRules
      parameters:
        - name: configId
          required: true
          in: path
          description: The identifier of the Cookie Consent Configuration to be queried.
          schema:
            type: string
        - $ref: '#/components/parameters/cmpRulesStoreTypeParam'
        - $ref: '#/components/parameters/cmpRulesClassificationParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextTokenParam'
      responses:
        '200':
          $ref: '#/components/responses/CmpRulesList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/rules:
    post:
      summary: Create New Cookie Consent Rules
      description: >-
        Create one or more Cookie Consent Rules. The maximum number of rules
        that may be created in a single call is 100.  If the request is
        successful, the response will contain a list of the created rules.
      tags:
        - cmpRules
      operationId: createRules
      requestBody:
        $ref: '#/components/requestBodies/CmpRulesPost'
      responses:
        '200':
          $ref: '#/components/responses/CmpRulesList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cookie-consent/rules/{ruleId}:
    patch:
      summary: Update Cookie Consent Rule
      description: Update an existing Cookie Consent Rule by ID.
      tags:
        - cmpRules
      operationId: updateRule
      parameters:
        - name: ruleId
          required: true
          in: path
          description: The identifier of the Cookie Consent Rule to be updated.
          schema:
            type: integer
            format: int32
      requestBody:
        $ref: '#/components/requestBodies/CmpRulePatch'
      responses:
        '200':
          $ref: '#/components/responses/CmpRulePatch'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Cookie Consent Rule
      description: Deletes a single Cookie Consent Rule by ID.
      tags:
        - cmpRules
      operationId: deleteRule
      parameters:
        - name: ruleId
          required: true
          in: path
          description: The identifier of the Cookie Consent Rule to be deleted.
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dsar:
    get:
      summary: List Subject Rights Requests (DEPRECATED)
      description: 'Deprecated: Please use /v1/subject-rights/requests instead'
      tags:
        - dsar
      operationId: getDsars2
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextTokenParam'
        - $ref: '#/components/parameters/afterParam'
        - $ref: '#/components/parameters/dsarSourceParam'
        - $ref: '#/components/parameters/dsarStatusParam'
        - $ref: '#/components/parameters/dsarRequestTypeParam'
        - $ref: '#/components/parameters/formIdParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create New Subject Rights Request(s) (DEPRECATED)
      description: 'Deprecated: Please use /v1/subject-rights/requests instead'
      tags:
        - dsar
      operationId: createDsars2
      requestBody:
        description: The Subject Rights Request(s) to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarList'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dsar/{dsarId}:
    get:
      summary: Return Detailed Subject Rights Request (DEPRECATED)
      description: 'Deprecated: Please use /v1/subject-rights/requests/{dsarId} instead'
      tags:
        - dsar
      operationId: getDsar2
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to return.
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update Subject Rights Request (DEPRECATED)
      description: 'Deprecated: Please use /v1/subject-rights/requests/{dsarId} instead'
      tags:
        - dsar
      operationId: updateDsar2
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to be updated.
          schema:
            type: string
      requestBody:
        description: Object containing the fields to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/dsar/{dsarId}/identification:
    post:
      summary: Update Identification Photo (DEPRECATED)
      description: >-
        Deprecated: Please use
        /v1/subject-rights/requests/{dsarId}/identification instead
      tags:
        - dsar
      operationId: updateIdentityFile2
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to be updated.
          schema:
            type: string
      requestBody:
        content:
          image/webp:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/subject-rights/requests:
    get:
      summary: List Subject Rights Requests
      description: >-
        Query for Subject Rights Requests.  Results are sorted in descending
        order by creation time.  The number of results returned may be
        controlled via the limit param, but may not exceed 500.  The "next"
        object in the response may be used to retrieve subsequent pages of the
        same resource.
      tags:
        - dsar
      operationId: getDsars
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextTokenParam'
        - $ref: '#/components/parameters/afterParam'
        - $ref: '#/components/parameters/dsarSourceParam'
        - $ref: '#/components/parameters/dsarStatusParam'
        - $ref: '#/components/parameters/dsarRequestTypeParam'
        - $ref: '#/components/parameters/formIdParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create New Subject Rights Request(s)
      description: >-
        Create one or more Subject Rights Requests.  The maximum number of
        requests that may be created in a single call is 100.  If the request is
        successful, the response will contain a list of the created requests.
      tags:
        - dsar
      operationId: createDsars
      requestBody:
        description: The Subject Rights Request(s) to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarList'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponseList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/subject-rights/requests/{dsarId}:
    get:
      summary: Return Detailed Subject Rights Request
      description: Get a detailed Subject Rights Request by ID.
      tags:
        - dsar
      operationId: getDsar
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to return.
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update Subject Rights Request
      description: >-
        Update metadata about a Subject Rights Request as specified.  A partial
        update may be performed.
      tags:
        - dsar
      operationId: updateDsar
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to be updated.
          schema:
            type: string
      requestBody:
        description: Object containing the fields to be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/subject-rights/requests/{dsarId}/identification:
    post:
      summary: Update Identification Photo
      description: >-
        Updates the file used for Identity Verification within the Osano
        platform.  It should be an image.
      tags:
        - dsar
      operationId: updateIdentityFile
      parameters:
        - name: dsarId
          required: true
          in: path
          description: The identifier of the Subject Rights Request to be updated.
          schema:
            type: string
      requestBody:
        content:
          image/webp:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/subject-rights/requests/{requestId}/summaries:
    get:
      summary: Get Request Summaries
      description: >-
        Query what summaries are available for this DSAR request before they are
        packaged and sent.
      tags:
        - dsar
      operationId: getRequestSummaries
      parameters:
        - name: requestId
          required: true
          in: path
          description: The identifier of the Subject Rights Request
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  summaries:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/subject-rights/requests/{requestId}/summary-notification:
    get:
      summary: Get Summary Notification
      description: >
        Retrieve information about a summary notification by request ID,
        including the archive status and metadata.


        This endpoint returns metadata about the notification package (PDF/ZIP
        archive) that was sent to the requestor, including:

        - The write status of the archive (NONE, WRITTEN, WRITE_ERROR)

        - The archive file name and type

        - When the summary was created

        - List of summary entries included in the archive
      tags:
        - dsar
      operationId: getSummaryNotification
      parameters:
        - name: requestId
          required: true
          in: path
          description: The identifier of the Subject Rights Request
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - dsarSummaryId
                  - requestId
                  - writeStatus
                  - summaryCreated
                  - summaryEntries
                properties:
                  dsarSummaryId:
                    type: string
                    description: The unique identifier for this summary notification
                  requestId:
                    type: string
                    description: The identifier of the Subject Rights Request
                  writeStatus:
                    type: string
                    enum:
                      - NONE
                      - WRITTEN
                      - WRITE_ERROR
                    description: The status of the archive write operation
                  archiveFileName:
                    type: string
                    nullable: true
                    description: The name of the archive file if it has been written
                  archiveFileType:
                    type: string
                    nullable: true
                    description: The MIME type of the archive file
                  summaryCreated:
                    type: string
                    format: date-time
                    description: When the summary notification was created
                  summaryEntries:
                    type: array
                    description: >-
                      List of all summary entries included in this notification
                      archive
                    items:
                      type: object
                      required:
                        - dsarSummaryEntryId
                        - fileName
                        - fileType
                        - manual
                        - created
                      properties:
                        dsarSummaryEntryId:
                          type: number
                          description: The unique identifier for this summary entry
                        fileName:
                          type: string
                          description: The name of the summary file
                        fileType:
                          type: string
                          description: The MIME type of the summary file
                        manual:
                          type: boolean
                          description: >-
                            Whether this summary was manually uploaded (true) or
                            automatically generated (false)
                        created:
                          type: string
                          format: date-time
                          description: When this summary entry was created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Send Summary Notification
      description: >
        Package and send all summaries for this DSAR request. This also
        generates a PDF summary containing automated data discovery results
        formatted as tables (by data store) and manually uploaded files, in
        addition to a ZIP archive containing all summary files plus the PDF.

        Subsequent POST requests to this endpoint for the DSAR request will do
        nothing, as the summaries have already been packaged and sent.
      tags:
        - dsar
      operationId: sendSummaryNotification
      parameters:
        - name: requestId
          required: true
          in: path
          description: The identifier of the Subject Rights Request
          schema:
            type: string
      responses:
        '200':
          description: >
            Success - The summary notification has been packaged and sent. 


            A ZIP archive containing a PDF summary and all associated files has
            been generated and delivered to the requestor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - dsarSummaryId
                  - requestId
                  - writeStatus
                  - summaryCreated
                  - summaryEntries
                properties:
                  dsarSummaryId:
                    type: string
                    description: The unique identifier for this summary notification
                  requestId:
                    type: string
                    description: The identifier of the Subject Rights Request
                  writeStatus:
                    type: string
                    enum:
                      - NONE
                      - WRITTEN
                      - WRITE_ERROR
                    description: The status of the archive write operation
                  archiveFileName:
                    type: string
                    nullable: true
                    description: The name of the archive file if it has been written
                  archiveFileType:
                    type: string
                    nullable: true
                    description: The MIME type of the archive file
                  summaryCreated:
                    type: string
                    format: date-time
                    description: When the summary notification was created
                  summaryEntries:
                    type: array
                    description: >-
                      List of all summary entries included in this notification
                      archive
                    items:
                      type: object
                      required:
                        - dsarSummaryEntryId
                        - fileName
                        - fileType
                        - manual
                        - created
                      properties:
                        dsarSummaryEntryId:
                          type: number
                          description: The unique identifier for this summary entry
                        fileName:
                          type: string
                          description: The name of the summary file
                        fileType:
                          type: string
                          description: The MIME type of the summary file
                        manual:
                          type: boolean
                          description: >-
                            Whether this summary was manually uploaded (true) or
                            automatically generated (false)
                        created:
                          type: string
                          format: date-time
                          description: When this summary entry was created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noSummaries:
                  value:
                    message: No summaries found for this request
                  summary: No summaries available to package
        '404':
          description: Not Found - The specified Subject Rights Request does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Subject Rights Request not found
                  summary: Request ID does not exist
        '409':
          description: >-
            Conflict - The summary notification has already been sent for this
            request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadySent:
                  value:
                    message: Summary notification has already been sent
                  summary: Notification already sent
