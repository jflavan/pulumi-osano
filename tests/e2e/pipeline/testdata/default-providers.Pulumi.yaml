# A release pipeline in miniature: manage the Cookie Consent config and its rules, publish them when
# the change token moves, then render the website's index.html with the CMP script first in <head>.
# The osano resources and the invoke pin the plugin version, so the engine uses default providers
# named after that version. {{PROVIDER_VERSION}} is replaced by the test.
name: osano-pipeline-e2e
runtime: yaml
description: Engine-level e2e program for the Osano provider (default providers).
config:
  changeToken:
    type: string
  buttonColor:
    type: string
  ruleTitle:
    type: string
resources:
  consentConfig:
    type: osano:index:CookieConsentConfig
    properties:
      name: pipeline-e2e
      domains:
        - www.example.com
      mode: permissive
      configuration:
        storagePolicyHref: https://www.example.com/privacy
        palette:
          buttonBackgroundColor: ${buttonColor}
    options:
      version: {{PROVIDER_VERSION}}
  analyticsRule:
    type: osano:index:CookieConsentRule
    properties:
      configId: ${consentConfig.configId}
      storeType: cookies
      classification: ANALYTICS
      rule: _ga
      disclosure: true
      title: ${ruleTitle}
      vendorName: Google
      ruleType: EXACT_MATCH
      description: Measures site usage.
      expiry: 2 years
    options:
      version: {{PROVIDER_VERSION}}
  publication:
    type: osano:index:CookieConsentPublication
    properties:
      configId: ${consentConfig.configId}
      changeToken: ${changeToken}
      keepUnclassifiedTattles: true
    options:
      version: {{PROVIDER_VERSION}}
      dependsOn:
        - ${consentConfig}
        - ${analyticsRule}
      customTimeouts:
        create: 5m
        update: 5m
variables:
  # Reads the config back after publishing (publication.configId resolves once the publish completes).
  publishedConfig:
    fn::invoke:
      function: osano:index:getCookieConsentConfig
      arguments:
        configId: ${publication.configId}
      options:
        version: {{PROVIDER_VERSION}}
  # The downstream website: the consent script must be the first element of <head>.
  indexHtml:
    fn::join:
      - "\n"
      - - "<!DOCTYPE html>"
        - '<html lang="en">'
        - "<head>"
        - ${publication.scriptTag}
        - '<meta charset="utf-8">'
        - "<title>Pipeline e2e</title>"
        - "</head>"
        - "<body><main>Hello</main></body>"
        - "</html>"
outputs:
  configId: ${consentConfig.configId}
  customerId: ${publication.customerId}
  scriptSrc: ${publication.scriptSrc}
  scriptTag: ${publication.scriptTag}
  publishedRevision: ${publication.publishedRevision}
  lookupExists: ${publishedConfig.exists}
  lookupScriptTag: ${publishedConfig.scriptTag}
  lookupPublishStatus: ${publishedConfig.publishStatus}
  lookupConfiguration: ${publishedConfig.configuration}
  indexHtml: ${indexHtml}
