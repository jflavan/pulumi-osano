# The same pipeline with an explicit provider resource whose version option pins the plugin. Bumping
# that version must update the provider in place (so later operations load the new plugin) without
# replacing any Osano resource. {{PROVIDER_VERSION}} is replaced by the test.
name: osano-pipeline-e2e-explicit
runtime: yaml
description: Engine-level e2e program for the Osano provider (explicit provider).
config:
  changeToken:
    type: string
  osanoBaseUrl:
    type: string
  osanoKey:
    type: string
    secret: true
resources:
  osanoProvider:
    type: pulumi:providers:osano
    properties:
      customerBaseUrl: ${osanoBaseUrl}
      osanoApiKey: ${osanoKey}
      requestTimeoutSeconds: 30
    options:
      version: {{PROVIDER_VERSION}}
  consentConfig:
    type: osano:index:CookieConsentConfig
    properties:
      name: pipeline-e2e-explicit
      domains:
        - shop.example.com
      mode: production
      configuration:
        storagePolicyHref: https://shop.example.com/privacy
    options:
      provider: ${osanoProvider}
  publication:
    type: osano:index:CookieConsentPublication
    properties:
      configId: ${consentConfig.configId}
      changeToken: ${changeToken}
    options:
      provider: ${osanoProvider}
      dependsOn:
        - ${consentConfig}
variables:
  publishedConfig:
    fn::invoke:
      function: osano:index:getCookieConsentConfig
      arguments:
        configId: ${publication.configId}
      options:
        provider: ${osanoProvider}
outputs:
  configId: ${consentConfig.configId}
  scriptTag: ${publication.scriptTag}
  lookupScriptTag: ${publishedConfig.scriptTag}
